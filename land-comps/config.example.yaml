# Example land-comps config. Copy to config.yaml and fill in the placeholders
# below (actor IDs, county file paths/codes) before running the pipeline.
# Secrets (TYPESAFE_API_KEY, APIFY_TOKEN, REGRID_TOKEN) do NOT go here; they
# come from the environment or a .env file (see .env.example).

search:
  initial_radius_mi: 1
  max_radius_mi: 5
  acreage_ratio_min: 0.33
  acreage_ratio_max: 3.0
  lookback_months: 24
  max_lookback_months: 36
  lookback_step_months: 12 # auto-widen adds this much lookback per step, up to the max
  # Auto-widen makes one acreage step to this band (candidate acres / subject acres).
  # Omit to derive it: acreage_ratio_min / 2 and acreage_ratio_max * 2.
  widened_acreage_ratio_min: 0.165
  widened_acreage_ratio_max: 6.0
  min_candidates: 8
  nominal_price_floor: 1000

scoring:
  w1: 0.30 # is_good_comp
  w2: 0.15 # physical_similarity
  w3: 0.15 # access_utilities_similarity
  w4: 0.15 # market_similarity
  w5: 0.10 # recency (1 - months_since_event / lookback)
  w6: 0.10 # proximity (1 - distance / max_radius)
  w7: 0.05 # sold-status bonus
  tier_floors:
    excellent: 0.85
    good: 0.65
    marginal: 0.40
  min_confidence: 0.5
  red_flag_policy: warn # warn | reject
  arms_length_min: 0.5 # arms_length probability below this forces tier = reject
  red_flags_max: 0.7 # red_flags probability above this rejects or warns (per red_flag_policy)

apify:
  # sian.agency/landwatch-property-scraper: county search, sold + available undeveloped land.
  # As of 2026-09-30 it returns an error row for every search (LandWatch blocks it);
  # the source then reports a SourceError and the run continues without it.
  landwatch_actor_id: "sian.agency/landwatch-property-scraper"
  # scrapemind/realtor-com-scraper takes Realtor.com search URLs; src/land_comps/realtor.py
  # builds the county's `type-land` URL for it. For-sale/pending only: the actor ignores
  # Realtor.com's recently-sold filter.
  realtor_actor_id: "scrapemind/realtor-com-scraper"
  max_items: 500
  cache_ttl_days: 7
  run_timeout_secs: 300 # per-actor run timeout; a timeout raises SourceError

county:
  # Park County, CO. FIPS must stay quoted so the leading zero survives YAML parsing.
  fips: "08093"
  # County name and state: the LandWatch and Realtor.com actors search by county
  # ("Park County, CO" and Realtor.com's "Park-County_CO"); the radius is applied afterwards.
  name: "Park County"
  state: "CO"
  # Park County schedule numbers (ScheduleNu on the parcel layer) are up to 8 digits.
  # Every source is zero-padded to this length before matching, so any value of 8 or
  # more works; keep it stable once sales, parcels, and benchmark comps are loaded.
  apn_length: 10
  sales_file: "data/county/park/sales.csv"
  parcels_file: "data/county/park/parcels.csv"
  centroids_file: "data/county/park/centroids.csv"
  # Maps canonical field name -> CSV column name. `comps ingest parcels` writes
  # parcels.csv/centroids.csv with these names; the assessor's sales file must use
  # the same names for apn, sale_date, sale_price, and deed_type (rename its header
  # if it does not).
  column_mapping:
    apn: "SCHEDULE_NUMBER"
    sale_date: "SALE_DATE"
    sale_price: "SALE_PRICE"
    deed_type: "DEED_TYPE"
    land_use_code: "LAND_USE_CODE"
    acreage: "ACRES"
    lat: "LAT"
    lon: "LON"
  # Land-use values that mark a parcel as vacant. Vacant Land is the parcel layer's
  # LAND_TY value (written to LAND_USE_CODE in parcels.csv); add the sales file's own
  # codes here if it uses a different vocabulary.
  vacant_land_codes:
    - "Vacant Land"
  # PLACEHOLDER: confirm real Park County excluded (non-arm's-length) deed types.
  excluded_deed_types:
    - "QC" # quitclaim
    - "TD" # tax deed

parcels:
  # Parcel spine for subject, address, and point lookups: "county" reads the local
  # county_parcels table filled by `comps ingest parcels` (free, offline); "regrid"
  # calls the Regrid API with REGRID_TOKEN.
  lookup: county
  arcgis_parcels_url: "https://maps.parkcountyco.gov/server/rest/services/ParcelsPublic/MapServer/0"
  arcgis_zoning_url: "https://maps.parkcountyco.gov/server/rest/services/Zoning/MapServer/0"

regrid:
  monthly_record_cap: 2000
